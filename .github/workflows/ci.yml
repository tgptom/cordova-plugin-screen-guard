name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  # Real screenshots on emulators: FLAG_SECURE blocks capture, clearing it restores capture.
  android-emulator:
    name: Android emulator API ${{ matrix.api }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api: [24, 25, 26, 27, 28, 29]
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.2
      - name: Build test APKs
        working-directory: tests/android
        run: gradle --no-daemon assembleDebug assembleDebugAndroidTest
      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          working-directory: tests/android
          script: gradle --no-daemon connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-test-report-api${{ matrix.api }}
          path: tests/android/app/build/reports/androidTests

  cordova-android:
    name: cordova-android@${{ matrix.platform }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [14, 15]
    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.2
      - run: npm i -g cordova@13
      - name: Build sample app
        run: |
          cordova create app com.example.screenguard ScreenGuardApp
          cd app
          cordova platform add android@${{ matrix.platform }}
          cordova plugin add ../plugin
          cordova build android

  cordova-ios:
    name: cordova-ios@${{ matrix.platform }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [7, 8]
    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i -g cordova@13
      - name: Build sample app
        run: |
          cordova create app com.example.screenguard ScreenGuardApp
          cd app
          cordova platform add ios@${{ matrix.platform }}
          cordova plugin add ../plugin
          cordova build ios --emulator
